# Render Blueprint — backend API + managed PostgreSQL.
#
# 1. Push the repository to GitHub.
# 2. In Render: New → Blueprint → select the repository.
# 3. Fill in the secret environment variables marked `sync: false`.
# 4. After the first deploy, open /docs to verify and set the Telegram webhook
#    (Admin panel → Настройки, or the curl command in docs/DEPLOY.md).

databases:
  - name: gift-market-db
    databaseName: giftmarket
    user: gift
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: gift-market-api
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: gift-market-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DEV_AUTH
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        value: gift-market-api.onrender.com
      - key: COMMISSION_PERCENT
        value: "10"
      - key: WEB_CONCURRENCY
        value: "2"
